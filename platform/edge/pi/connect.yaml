# Redpanda Connect 4.116.1. The small shell adapters read Linux hardware;
# Connect owns scheduling, event identifiers, backpressure and delivery.
http:
  address: 127.0.0.1:4195
input:
  broker:
    inputs:
      - generate:
          interval: 1s
          mapping: 'root = ""'
        processors:
          - command:
              name: /bin/bash
              args_mapping: '["/etc/lagom-pi/health.sh"]'
          - mapping: |
              root = content().parse_json()
              root.throttled = this.throttled == 1
              root.under_voltage = this.under_voltage == 1
              root.collected_at = now().ts_format("2006-01-02T15:04:05.000000000Z", "UTC")
      - subprocess:
          name: /bin/bash
          args: [/etc/lagom-pi/ping.sh, gateway]
          restart_on_exit: true
      - subprocess:
          name: /bin/bash
          args: [/etc/lagom-pi/ping.sh, resolver-a]
          restart_on_exit: true
      - subprocess:
          name: /bin/bash
          args: [/etc/lagom-pi/ping.sh, resolver-b]
          restart_on_exit: true
      - subprocess:
          name: /bin/bash
          args: [/etc/lagom-pi/ping.sh, node]
          restart_on_exit: true
pipeline:
  processors:
    - mapping: |
        root = this
        root.source = "pi"
        root.collected_at = if this.signal == "ping" {
          this.observed_at.ts_format("2006-01-02T15:04:05.000000000Z", "UTC")
        } else { this.collected_at }
        root.observed_at = deleted()
    - mapping: |
        let stream = if this.signal == "ping" { "ping." + this.target } else { this.signal }
        root = this
        root.event_id = "pi/%s/%s".format($stream, this.collected_at)
        meta event_id = "pi/%s/%s".format($stream, this.collected_at)
        meta nats_subject = "events.pi.%s".format($stream)
output:
  # Failed collection is never published as a plausible event. The error is
  # logged; the next reading tries again. Absence is visible by source/stream.
  reject_errored:
    nats_jetstream:
      urls: [nats://127.0.0.1:4222]
      subject: ${! @nats_subject }
      headers:
        Nats-Msg-Id: ${! @event_id }
      max_in_flight: 64
logger:
  level: INFO
  format: logfmt
