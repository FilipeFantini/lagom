# Applied by the runbook, not Argo CD. Only local processes reach the Pi.
server_name: edge
listen: 127.0.0.1:4222
http: 127.0.0.1:8222
ping_interval: 10s
ping_max: 3
jetstream {
  store_dir: /var/lib/lagom-nats
  domain: leaf
  max_memory_store: 16MB
  max_file_store: 640MB
}
leafnodes {
  reconnect: 2
  remotes: [{url: $LEAF_URL}]
}
