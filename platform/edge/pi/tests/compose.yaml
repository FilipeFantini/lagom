# No published ports, real credentials or outside network in this lab.
services:
  hub:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: [-c, /lab/hub.conf]
    environment:
      NATS_INTERNAL_PASSWORD: lab-internal
      NATS_PI_PASSWORD: lab-pi
      GOMEMLIMIT: 96MiB
    volumes: ["${LAB_DIR}:/lab:ro"]
    mem_limit: 128m
    networks: [lab]
  leaf:
    image: nats:2.15.2-alpine@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: [-c, /lab/leaf.conf]
    environment:
      LEAF_URL: nats-leaf://pi:lab-pi@hub:7422
      GOMEMLIMIT: 96MiB
    volumes: ["${LAB_DIR}:/lab:ro"]
    mem_limit: 128m
    networks: [lab]
  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_PASSWORD: lab-only
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: serving
    tmpfs: [/var/lib/postgresql]
    mem_limit: 256m
    networks: [lab]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d serving]
      interval: 1s
      retries: 30
  connect:
    image: redpandadata/connect:4.116.1@sha256:47ff773082146b6e538c527509af1a736b53063e68f0eb1266253a0832b39396
    command: [--disable-telemetry, run, /lab/consumer.yaml]
    environment:
      NATS_URL: nats://hub:4222
      NATS_INTERNAL_PASSWORD: lab-internal
      PG_HOST: postgres
      PG_SSLMODE: disable
      PG_USER: postgres
      PG_PASSWORD: lab-only
      GOMEMLIMIT: 200MiB
    volumes: ["${LAB_DIR}:/lab:ro"]
    mem_limit: 256m
    networks: [lab]
  check:
    # Same multi-arch Python 3.13 base image pinned by platform/orchestration/Dockerfile.
    image: python:3.13-slim-trixie@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
    entrypoint: [python, /repo/platform/edge/pi/tests/lab.py]
    volumes: ["${REPO_DIR}:/repo:ro", "${LAB_DIR}:/lab"]
    mem_limit: 256m
    networks: [lab]
    profiles: [tools]
networks:
  lab:
    internal: true
