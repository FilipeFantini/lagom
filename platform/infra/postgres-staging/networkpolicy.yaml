# Who reaches staging's Postgres. Without this policy no NetworkPolicy
# selects its Pod, so a Pod in any namespace could open a connection to it and
# only a password would stand in the way. The Pod is closed to everything but:
#
# 1. Pods in `staging` itself: Dagster and its runs;
# 2. the CloudNativePG operator in `cnpg-system`, which calls the instance
#    manager's status port, as in prod's allow-prod-and-operator.
#
# It selects only the Postgres Pod (the operator labels it with its
# Cluster's name). What it does not block, as in prod: the kubelet's probes,
# `kubectl port-forward` (the developer's way in, runbook) and egress
# (postgres-prod/networkpolicy.yaml records why).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
