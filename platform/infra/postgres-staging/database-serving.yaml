# The database `serving` (ADR-0041, ADR-0047): the streaming showcase's live
# table and the views over it, owned by the role `serving` (cluster.yaml).
# Its schemas and objects are dbt's (platform/warehouse/, the `serving`
# target). The live table is UNLOGGED, so in prod its events will never reach
# R2 through the backup; staging has no backup (ADR-0046).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: serving
spec:
  name: serving
  owner: serving
  cluster:
    name: postgres
  ensure: present
