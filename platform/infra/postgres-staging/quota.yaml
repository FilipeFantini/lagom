# What keeps staging from starving prod: the kubelet and API server refuse
# what exceeds these, rather than relying on good intentions (ADR-0007).
#
# Arithmetic, in memory, request / limit in Mi (finished Pods stop counting):
#   Postgres Pod, with the backup sidecar (ADR-0025)    364 /  768
#   Dagster webserver, daemon, code server (ADR-0026)   800 / 1920
#   one Dagster run, its own tag in the code location   768 / 1024
#                                                       ----   ----
#                                                       1932 / 3712
# rounded up to 2432 / 4608, about 500 Mi of room for a restore test or a
# manual run. The CronJob usgs-pipeline (256 / 512) counted here until it was
# retired on 2026-11-07 (ADR-0033); the quota was left as it was. Dagster's figures are measured (architecture.md section 11). The budget check counts the same workloads against the node's
# ceiling (architecture.md section 11); the quota keeps staging inside them.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging
spec:
  hard:
    requests.memory: 2432Mi
    limits.memory: 4608Mi
    requests.cpu: 500m
    pods: "10"
---
# A quota on requests and limits rejects any Pod that does not declare them.
# These defaults fill in for a container that says nothing, and `max` stops one
# container from taking more than 1 GiB: the largest is a Dagster run, which
# loads with dlt and builds with dbt-duckdb in one process (ADR-0026).
apiVersion: v1
kind: LimitRange
metadata:
  name: staging
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 64Mi
        cpu: 10m
      default:
        memory: 256Mi
      max:
        memory: 1Gi
