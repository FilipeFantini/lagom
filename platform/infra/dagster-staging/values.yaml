# Helm values for Dagster in staging (ADR-0026). Prod's file
# (dagster-prod/values.yaml) mirrors this one; a change to one is made to both.
# Chart: dagster/dagster 1.13.27, from https://dagster-io.github.io/helm.
# Only what differs from the chart defaults is set here.
#
# Memory figures are set from measurement in staging (architecture.md
# section 11): peaks by the kubelet over an hour of runs on 2026-10-28, and
# again after seven days of uptime on 2026-11-05.

# The metadata lives in the database `dagster` of staging's Postgres, as the
# role `dagster` (postgres-staging/cluster.yaml). Its password is in the
# sealed Secret dagster-db, under the key the chart reads.
global:
  postgresqlSecretName: dagster-db
generatePostgresqlPasswordSecret: false
postgresql:
  enabled: false
  postgresqlHost: postgres-rw
  postgresqlUsername: dagster
  postgresqlDatabase: dagster
  # Pod to Service: TLS required, as every in-cluster client here.
  postgresqlParams:
    sslmode: require
  # psycopg2, the driver dagster-postgres declares and Dagster's SQL is written
  # for. SQLAlchemy 2.1 would pick psycopg 3, whose server-side parameters
  # ("\$1") Dagster's statements reject: the first staging run failed with
  # `syntax error at or near "$1"` (2026-10-28).
  postgresqlScheme: postgresql+psycopg2
  service:
    port: 5432

telemetry:
  enabled: false

dagsterWebserver:
  # No UI in staging (ADR-0046): the operator rarely validates there, and a
  # staging run is followed in its Pod's logs and through the failure alarm.
  # Zero replicas keeps the chart's objects without the Pod (160 MiB); the
  # settings below stay for the day it returns, with the tunnel's rule for
  # https://ops.ofantini.com/dagster-staging (cloudflared/config.yaml).
  replicaCount: 0
  # The webserver mounts every route under this prefix, the UI's links and
  # WebSocket included, and answers only a redirect at "/".
  pathPrefix: /dagster-staging
  # The chart's probe asks for /server_info at the root, which the prefix
  # leaves unanswered: the Pod would never be ready. Helm merges this path
  # into the chart's probe, keeping its timings.
  readinessProbe:
    httpGet:
      path: /dagster-staging/server_info
  # Measured 127-141 MiB.
  resources:
    requests: {cpu: 25m, memory: 160Mi}
    limits: {memory: 384Mi}
  # The init container only waits for Postgres.
  initContainerResources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 32Mi}

dagsterDaemon:
  # Measured 104 MiB at start, 206 after four hours, 263 after seven days:
  # it grows with uptime. Watched; the limit is what stops it.
  resources:
    requests: {cpu: 25m, memory: 320Mi}
    limits: {memory: 512Mi}
  initContainerResources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 32Mi}
  runCoordinator:
    enabled: true
    type: QueuedRunCoordinator
    config:
      queuedRunCoordinator:
        # One run at a time, of any job (ADR-0046): the budget check counts one
        # run's memory per environment (the Application's
        # lagom.dev/ephemeral-memory-request), and fails unless this is 1. A
        # new batch source then takes turns in the same slot instead of adding
        # a run nobody counted. The chart's default is no limit.
        maxConcurrentRuns: 1
        # Two runs of the pipeline never overlap: both would read dlt's cursor
        # and write it back (the CronJob's concurrencyPolicy: Forbid). Kept
        # beside the limit above, because it is a correctness rule, not a
        # budget one, and must hold if that limit is ever raised.
        tagConcurrencyLimits:
          - key: lagom/pipeline
            value: usgs
            limit: 1

runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      # The image is pinned by digest, so a cached copy is the right copy.
      imagePullPolicy: IfNotPresent
      runK8sConfig:
        # The code location's container securityContext does not reach runs:
        # the chart passes only the Pod-level one. It is set here for every
        # run's container (found in review of PR #32).
        containerConfig:
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
        jobSpecConfig:
          # No retry from Kubernetes: Dagster decides, and a failed run waits
          # for the next schedule. A finished Job and its Pod go after an hour,
          # and a hung run is stopped after 25 minutes, before the next slot.
          backoffLimit: 0
          ttlSecondsAfterFinished: 3600
          activeDeadlineSeconds: 1500

dagster-user-deployments:
  enabled: true
  enableSubchart: true
  imagePullSecrets:
    - name: ghcr-pull
  deployments:
    - name: lagom
      image:
        repository: ghcr.io/filipefantini/lagom-orchestration
        # Pinned by digest (ADR-0015): built from main at 6de3cfe (PR #127,
        # the incremental minute tables, ADR-0047 decision 8; before it
        # 371b851, PR #121, the `streaming_archive` job, decision 6). The code
        # location needs HEARTBEAT_URL, set below, and reads LAGOM_STREAMING.
        tag: "6de3cfe394051964892ea126b1965a0e36c658e6@sha256:fabb201d0e19c4b6e0a858ba3ea32ddf84333aa4342543a2f1bf249e9d471db9"
        pullPolicy: IfNotPresent
      dagsterApiGrpcArgs: ["-m", "lagom_orchestration.definitions"]
      port: 3030
      # Runs inherit this deployment's image, environment, volumes and Pod
      # security context, in this namespace. The container security context
      # is set for runs in runLauncher above. Their resources are not these:
      # a tag on each job in the code location sets them (RUN_RESOURCES in
      # lagom_orchestration/definitions.py), and wins. The same tag adds the
      # job's Secrets to the environment below (ADR-0044).
      includeConfigInLaunchedRuns:
        enabled: true
      # The code server alone: measured 203-291 MiB. The limit stays at 1Gi
      # for one case: a run launched from the asset catalog instead of a job
      # belongs to Dagster's implicit asset job, which has no RUN_RESOURCES
      # tag, so it takes these figures. Since ADR-0044 it has no credentials
      # either and fails at its first asset. Start runs from the job page.
      resources:
        requests: {cpu: 50m, memory: 320Mi}
        limits: {memory: 1Gi}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      # Every writer goes to /tmp: dlt, dbt, DuckDB's extensions and spill.
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      # The code server's environment, which every run Pod inherits
      # (includeConfigInLaunchedRuns). It holds the settings that are not
      # secret, which differ by environment, and the variable the code
      # location needs to load. It holds no credential: each job names the
      # Secrets its Pod gets in its own tag (WRITER_ENV in
      # lagom_orchestration/definitions.py, ADR-0044), and dagster-k8s adds
      # them to this list. The tag's variables read none of these, and these
      # read none of the tag's: no $(NAME) crosses the two lists.
      env:
        - name: PGSSLMODE
          value: require
        # dlt's DuckLake destination, without its credentials.
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__DUCKLAKE_NAME
          value: lagom
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__METADATA_SCHEMA
          value: ducklake
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__BUCKET_URL
          value: s3://lagom-staging-lake
        - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__REGION_NAME
          value: auto
        # The same lake for dbt's `lake` target and the maintenance job; the
        # catalog and the R2 token come from the job's tag.
        - name: LAGOM_LAKE_DATA_PATH
          value: s3://lagom-staging-lake/
        - name: LAGOM_LAKE_METADATA_SCHEMA
          value: ducklake
        # The bucket the dashboards' pages are published to (public, on the
        # custom domain lagom-staging.ofantini.com). Not secret. Its write
        # token comes from the dashboards job's tag (READER_ENV in
        # lagom_orchestration/definitions.py), like the lake's read-only ones.
        - name: LAGOM_DASHBOARDS_BUCKET
          value: lagom-staging-dashboards
        # The alarm's ping URL (ADR-0033): staging's Healthchecks.io check,
        # sealed in postgres-staging/pipeline-heartbeat-sealed.yaml, the
        # CronJob's until it was retired. The code location does not load
        # without it. Run Pods inherit it because they import the same module
        # (ADR-0033, decision 5).
        - name: HEARTBEAT_URL
          valueFrom: {secretKeyRef: {name: pipeline-heartbeat, key: url}}
        # The streaming showcase runs here (ADR-0047): the `streaming` job and
        # its hourly schedule exist only where this is "true", and anything
        # but "true" or "false" stops the code location. Its credentials come
        # from the job's tag (SERVING_ENV), not from here. Prod leaves it
        # unset until the showcase reaches it.
        - name: LAGOM_STREAMING
          value: "true"
