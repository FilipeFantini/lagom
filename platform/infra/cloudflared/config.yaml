# What the tunnel serves (ADR-0030). This file is the whole list of what the
# internet can ask for through it: a hostname not listed here gets a 404 from
# the tunnel, whatever the DNS says.
#
# There is no `tunnel:` key: the sealed token (token-sealed.yaml) carries the
# tunnel's ID and secret, so neither is in the repository.
#
# `access` makes cloudflared itself check, on every request, the JWT that
# Cloudflare Access adds after a login, against this team's keys and this
# application's audience tag. A request without a valid one is refused here,
# so an Access application deleted or set to bypass by mistake fails closed
# instead of publishing a UI that has no login of its own. The team name and
# the audience tag are not secrets: Access puts both in the URL of every
# redirect to its login page.
#
# cloudflared reads this file at start only. A change here must also change
# `lagom.dev/config-revision` in deployment.yaml, which restarts it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
data:
  config.yaml: |
    # Liveness and readiness are read from /ready on this port.
    metrics: 0.0.0.0:2000
    originRequest:
      access:
        required: true
        teamName: <team-name>
        audTag:
          - <access-aud-tag>
    ingress:
      - hostname: dagster-staging.getlagom.app
        service: http://dagster-dagster-webserver.staging.svc.cluster.local:80
      - hostname: dagster.getlagom.app
        service: http://dagster-dagster-webserver.prod.svc.cluster.local:80
      # Anything else: refused by the tunnel.
      - service: http_status:404
