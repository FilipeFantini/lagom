# Who reaches Grafana: cloudflared, on Grafana's port, and nothing else
# (ADR-0030). Grafana has no login of its own (config.yaml), so this policy
# and cloudflared's check of the Access token are what keep a Pod of the
# cluster from reading the dashboards around the login. The kubelet's probes
# and `kubectl port-forward` are not blocked (postgres-prod/networkpolicy.yaml
# records why).
#
# Not restricted: Grafana's egress. It needs cluster DNS and staging's
# Postgres; what it would send elsewhere is turned off in grafana.ini.
# Staging's side is postgres-staging/networkpolicy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloudflared
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - {protocol: TCP, port: 3000}
