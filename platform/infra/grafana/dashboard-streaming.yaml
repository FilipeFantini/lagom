# The streaming showcase's dashboard (ADR-0045, decision 9; ADR-0047, decision
# 3): one panel per question of ADR-0045's decision 5, each reading one view of
# the schema `metrics`, whose columns are a dbt contract
# (platform/warehouse/models/streaming/metrics/). Panels read nothing else:
# what computes a metric can change behind its view without a panel changing.
#
# Grafana reads this file again every 30 seconds (config.yaml), so a merged
# change needs no restart. It is not editable in the UI.
#
# Times are event time (`collected_at`), in UTC. Every time series query
# filters on the panel's time range: the views are computed when read, so a
# wide range is a slower query (ADR-0047, decision 8).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  streaming.json: |
    {
      "uid": "streaming",
      "title": "Streaming showcase",
      "description": "One panel per question of ADR-0045, decision 5. Every query reads a view of the schema metrics, in event time and UTC.",
      "tags": [
        "lagom",
        "streaming"
      ],
      "timezone": "utc",
      "editable": false,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "schemaVersion": 41,
      "version": 1,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Environment",
            "type": "datasource",
            "query": "grafana-postgresql-datasource",
            "regex": "/^serving/",
            "current": {
              "text": "serving (staging)",
              "value": "serving-staging"
            },
            "hide": 0
          },
          {
            "name": "source",
            "label": "Source",
            "type": "query",
            "datasource": {
              "type": "grafana-postgresql-datasource",
              "uid": "${datasource}"
            },
            "definition": "select distinct source from metrics.source_health_minute where $__timeFilter(minute_start)",
            "query": "select distinct source from metrics.source_health_minute where $__timeFilter(minute_start) order by 1",
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "target",
            "label": "Target",
            "type": "custom",
            "query": "node,resolver-a,resolver-b,gateway",
            "current": {
              "text": "node",
              "value": "node"
            },
            "options": [
              {
                "text": "node",
                "value": "node",
                "selected": true
              },
              {
                "text": "resolver-a",
                "value": "resolver-a",
                "selected": false
              },
              {
                "text": "resolver-b",
                "value": "resolver-b",
                "selected": false
              },
              {
                "text": "gateway",
                "value": "gateway",
                "selected": false
              }
            ],
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 3,
          "type": "timeseries",
          "title": "Is it the home router or the provider",
          "description": "Loss per target (link_minute): the gateway is the home router; resolver-a, resolver-b and node are beyond it. Loss beyond the router while the gateway answers points at the provider.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    ping_target as metric,\n    100 * sum(lost_pings)::double precision / nullif(sum(pings), 0) as value\nfrom metrics.link_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1, 2\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Is it good enough for a video call ($target)",
          "description": "Jitter, the mean step between consecutive answered round trips, and loss, for the target picked above (link_minute). The red lines are common limits for a call: jitter under 30 ms, loss under 1%. Over more than a minute per point, jitter is the mean of the minutes.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    avg(jitter_ms) as \"jitter\",\n    100 * sum(lost_pings)::double precision / nullif(sum(pings), 0) as \"loss\"\nfrom metrics.link_minute\nwhere $__timeFilter(minute_start) and source = '$source' and ping_target = '$target'\ngroup by 1\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 30
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "loss"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 1,
          "type": "table",
          "title": "How long was the link down",
          "description": "Per target, over the time range: outages (runs of consecutive lost pings, link_outages), the time they lasted, and availability, the share of pings answered (link_minute). Pick 'This month' in the time picker for the month; the live table holds about 7 days.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "with answered as (\n    select ping_target, sum(pings) as pings, sum(lost_pings) as lost_pings\n    from metrics.link_minute\n    where $__timeFilter(minute_start) and source = '$source'\n    group by ping_target\n),\noutages as (\n    select\n        ping_target,\n        count(*) as outages,\n        sum(duration_seconds) as down_seconds,\n        max(duration_seconds) as longest_seconds\n    from metrics.link_outages\n    where $__timeFilter(started_at) and source = '$source'\n    group by ping_target\n)\nselect\n    a.ping_target as \"Target\",\n    coalesce(o.outages, 0) as \"Outages\",\n    coalesce(o.down_seconds, 0) as \"Down\",\n    o.longest_seconds as \"Longest\",\n    100 * (1 - a.lost_pings::double precision / nullif(a.pings, 0)) as \"Availability\"\nfrom answered as a\nleft join outages as o using (ping_target)\norder by \"Target\""
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Down"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Longest"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Availability"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 3
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "At which hours is the link worse ($target)",
          "description": "Median and 95th-percentile round trip, and loss, by day of the week and hour of the day in UTC, for the target picked above, over everything the live table holds (link_hour_profile), not the time range. Sorted worst first.",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "table",
              "rawQuery": true,
              "rawSql": "select\n    (array['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'])[day_of_week] as \"Day\",\n    hour_of_day as \"Hour (UTC)\",\n    pings as \"Pings\",\n    100 * lost_pings::double precision / nullif(pings, 0) as \"Loss\",\n    rtt_p50_ms as \"Median\",\n    rtt_p95_ms as \"95th percentile\"\nfrom metrics.link_hour_profile\nwhere source = '$source' and ping_target = '$target'\norder by rtt_p95_ms desc nulls last"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Loss"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Median"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "ms"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "95th percentile"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "ms"
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Does the source get hot enough to slow down",
          "description": "The CPU's highest temperature, the mean load over one minute, and the seconds it reported throttling (source_health_minute).",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    max(cpu_temp_max_c) as \"temperature\",\n    avg(load_1m_avg) as \"load\",\n    sum(throttled_seconds) as \"throttled\"\nfrom metrics.source_health_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "load"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "throttled"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "custom.drawStyle",
                    "value": "bars"
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 60
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Is the source's power supply adequate",
          "description": "Seconds in which the source reported under-voltage (source_health_minute). Any bar is a supply that sagged.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    sum(under_voltage_seconds) as \"under-voltage\"\nfrom metrics.source_health_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "When does the source's disk fill",
          "description": "Disk used against its size (source_health_minute). The slope of 'used' over a week says when it reaches 'size'.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    max(disk_used_bytes) as \"used\",\n    max(disk_total_bytes) as \"size\"\nfrom metrics.source_health_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "decbytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "How late is an event, end to end",
          "description": "When the hub stored an event minus when the source collected it, by minute of collection (pipeline_minute): the slowest event, and the median of a minute (over more than a minute per point, the mean of the minutes' medians). Logarithmic: the backlog of an outage is hours, a live event under a second.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    max(lateness_max_seconds) as \"slowest\",\n    avg(lateness_p50_seconds) as \"median\"\nfrom metrics.pipeline_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "scaleDistribution": {
                  "type": "log",
                  "log": 10
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "How much arrived, and how much arrived late",
          "description": "Events per second of collection time, per stream (pipeline_minute): each stream should hold one a second, the red line. 'late' counts the events, all streams together, that reached the hub more than a minute after they were collected: the backlog delivered after an outage, placed at the time it was collected.",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "datasource": {
            "type": "grafana-postgresql-datasource",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    event_stream as metric,\n    sum(events) / ($__interval_ms / 1000.0) as value\nfrom metrics.pipeline_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1, 2\norder by 1"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "grafana-postgresql-datasource",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "format": "time_series",
              "rawQuery": true,
              "rawSql": "select\n    $__timeGroupAlias(minute_start, $__interval),\n    sum(late_events) / ($__interval_ms / 1000.0) as \"late\"\nfrom metrics.pipeline_minute\nwhere $__timeFilter(minute_start) and source = '$source'\ngroup by 1\norder by 1"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "late"
                },
                "properties": [
                  {
                    "id": "custom.drawStyle",
                    "value": "bars"
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 60
                  },
                  {
                    "id": "custom.thresholdsStyle",
                    "value": {
                      "mode": "off"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          }
        }
      ],
      "annotations": {
        "list": []
      }
    }
