# One Grafana for the operator, for both environments (ADR-0046, decision 4;
# ADR-0047, decision 7), served at ops.ofantini.com/grafana behind Cloudflare
# Access (ADR-0030). It reads the views of the database `serving` and
# nothing else; its data sources and its dashboard are files in this
# directory (config.yaml, dashboard-streaming.yaml), so the UI changes
# nothing that lasts.
#
# Its state is Grafana's own SQLite database on the volume below: sessions,
# the provisioned objects' copies, preferences. Nothing in it is a source:
# lost, it is created again from these files at the next start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  # One writer of the SQLite file at a time: the old Pod stops before the new
  # one mounts the volume.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
      annotations:
        # Bump with every change to grafana.ini or the data sources in
        # config.yaml: Grafana reads them at start. The dashboard is read
        # again from its mounted file every 30 seconds and needs no restart.
        lagom.dev/config-revision: "1"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The image's own user, `grafana`.
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          # 13.3.1, released 2026-11-10, the latest patch of the newest
          # minor; multi-arch, arm64 included.
          image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
          env:
            - name: GF_PATHS_CONFIG
              value: /etc/grafana/grafana.ini
            # The read-only role's password, for the data source in
            # config.yaml. Staging's Cluster holds the same password in its
            # own copy of this Secret (postgres-staging/).
            - name: GRAFANA_READER_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-reader-credentials, key: password}}
            # Go runtime: return memory before the container limit is reached.
            - name: GOMEMLIMIT
              value: 300MiB
          ports:
            - {name: http, containerPort: 3000}
          # Measured locally on 2026-11-17, in this image under this config
          # (one data source process, alerting off): 185 MiB of working set at
          # rest, 220 MiB after the dashboard read 26 hours of events.
          # ADR-0047's guess of 128 MiB is below both. Read on the node after
          # a day with `kubectl top` and re-set (runbook).
          resources:
            requests: {cpu: 25m, memory: 256Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # /api/health answers 200 once the database is reachable. Under
          # serve_from_sub_path it is served under the prefix too.
          readinessProbe:
            httpGet: {path: /grafana/api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /grafana/api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/grafana.ini, subPath: grafana.ini, readOnly: true}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            # Not by subPath: a ConfigMap mounted whole is updated in place,
            # so a merged dashboard reaches Grafana without a restart.
            - {name: dashboards, mountPath: /var/lib/grafana-dashboards, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
        - name: config
          configMap: {name: grafana-config}
        - name: datasources
          configMap:
            name: grafana-config
            items: [{key: datasources.yaml, path: datasources.yaml}]
        - name: dashboard-providers
          configMap:
            name: grafana-config
            items: [{key: dashboards.yaml, path: dashboards.yaml}]
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
