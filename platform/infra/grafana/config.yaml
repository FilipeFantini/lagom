# Grafana's settings and what it provisions at start (grafana.yaml mounts
# each key). A change to grafana.ini or datasources.yaml must also change
# `lagom.dev/config-revision` in grafana.yaml, which restarts it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
data:
  grafana.ini: |
    # Only what differs from Grafana's defaults (conf/defaults.ini of 13.3.1).
    [server]
    # Served under /grafana on the operator's hostname (cloudflared/config.yaml);
    # the tunnel passes the path on unchanged, so Grafana serves itself under it.
    root_url = https://ops.ofantini.com/grafana/
    serve_from_sub_path = true

    [paths]
    data = /var/lib/grafana
    provisioning = /etc/grafana/provisioning

    [database]
    # Grafana's own state, on its volume (grafana.yaml).
    type = sqlite3

    # Who sees what. Cloudflare Access is the login, and cloudflared checks
    # its token on every request (ADR-0030); the NetworkPolicy admits only
    # cloudflared. Behind that, every visitor is the operator, as an
    # anonymous Viewer: it can open the dashboard and run its queries, and
    # change nothing. No admin user is created and no login form is shown,
    # so there is no Grafana password to keep. What a Viewer can still do is
    # send any query to the data source; the database role is what limits
    # it (postgres-staging/cluster.yaml): what it may read, that it may write
    # nothing, and its connections. The role's statement timeout is only a
    # default a session may change with SET: it stops a slow dashboard query,
    # not a Viewer who means harm. That Viewer is the operator, behind Access.
    [security]
    disable_initial_admin_creation = true
    disable_gravatar = true
    cookie_secure = true
    cookie_samesite = strict

    [auth]
    disable_login_form = true

    [auth.basic]
    enabled = false

    [auth.anonymous]
    enabled = true
    org_role = Viewer
    hide_version = true

    [users]
    allow_sign_up = false
    allow_org_create = false

    # Nothing leaves the node on Grafana's initiative: no usage reports, no
    # update or news checks, no plugins installed at start, and no snapshot
    # or public dashboard, which would copy panel data outside the login.
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    check_for_plugin_updates = false
    feedback_links_enabled = false

    [plugins]
    preinstall_disabled = true
    # Grafana 13 runs each bundled data source as a process of its own, about
    # 30 MiB each: with all fourteen the container held 356 MiB at rest
    # (measured locally, 2026-11-17). Only PostgreSQL is used, so the others
    # are not loaded. A new kind of data source is removed from this list in
    # the change that provisions it.
    disable_plugins = cloudwatch,elasticsearch,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin

    [news]
    news_feed_enabled = false

    [snapshots]
    enabled = false
    external_enabled = false

    [public_dashboards]
    enabled = false

    # No alert rule exists: the environments' alarms are Dagster's, through
    # Healthchecks.io (ADR-0033). Off, it saved 27 MiB at rest (measured
    # locally, 2026-11-17). It is turned on with the first rule.
    [unified_alerting]
    enabled = false

    [log]
    mode = console

  # The data sources, one per environment's `serving` (ADR-0047, decision 7).
  # Staging's only: prod's comes with M6 in prod. `prune` removes a data
  # source deleted from this file.
  datasources.yaml: |
    apiVersion: 1
    prune: true
    datasources:
      - name: serving (staging)
        uid: serving-staging
        type: grafana-postgresql-datasource
        access: proxy
        # CloudNativePG's read-write Service of staging's Cluster.
        url: postgres-rw.staging.svc.cluster.local:5432
        user: grafana_reader
        editable: false
        jsonData:
          database: serving
          # TLS without checking the server's certificate, as Redpanda
          # Connect does: the Cluster's CA lives in `staging`, which this
          # namespace cannot mount.
          sslmode: require
          # Two connections at most, under the role's limit of 3 (one left
          # for the operator's checks); Grafana's default is 100.
          maxOpenConns: 2
          maxIdleConns: 2
          maxIdleConnsAuto: false
          connMaxLifetime: 14400
          # The views are per minute: a finer interval adds points, not
          # information.
          timeInterval: 1m
        secureJsonData:
          password: $__env{GRAFANA_READER_PASSWORD}

  # Dashboards are read from the files of grafana-dashboards, mounted at
  # /var/lib/grafana-dashboards, and cannot be saved from the UI: a change is
  # a change to dashboard-streaming.yaml.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: lagom
        type: file
        disableDeletion: true
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana-dashboards
