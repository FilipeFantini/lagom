# What the operator reaches over the tailnet by a stable address, not by
# kubectl port-forward (ADR-0028). Each object here is a Service at a fixed
# cluster IP; `tailscale serve` on the node, configured by hand from the
# runbook, forwards one tailnet port to each. Nothing here runs a Pod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailnet-access
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FilipeFantini/robusta.git
    targetRevision: main
    path: platform/infra/tailnet-access
  # No destination namespace: the Services sit in different environments, so
  # each names its own.
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # A Service holds no state; removing its file removes the address, and
      # the tailnet port then answers with an error until serve is turned off.
      prune: true
      selfHeal: true
