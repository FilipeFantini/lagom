version: 2

# The tables of minutes the views of metrics/ read (ADR-0047, decision 8;
# macros/streaming/changed_minutes.sql). Not read by Grafana, which cannot:
# their columns are not a published interface, and a change to them fails
# the incremental build (`on_schema_change: fail`) until `--full-refresh`.
# tests/streaming/minutes_equal_a_full_computation.sql checks what the views
# read from them.
models:
  - name: ping_minute
    description: >
      The link per minute of event time (UTC), per source and target, with
      each minute's round trips, runs of lost pings and lateness. One row a
      minute that has pings in the live table.
    data_tests:
      - unique_combination:
          arguments:
            columns: [minute_start, source, ping_target]

  - name: health_minute
    description: >
      The source's health per minute of event time (UTC), with its lateness.
      One row a minute that has readings in the live table.
    data_tests:
      - unique_combination:
          arguments:
            columns: [minute_start, source]

unit_tests:
  - name: stg_events__pings_has_no_round_trip_for_a_lost_ping
    description: >
      Whatever the payload carries for a lost ping, its round trip is null, so
      it cannot enter a percentile.
    model: stg_events__pings
    given:
      - input: source('live', 'events')
        rows:
          - {event_id: a, source: s, signal: ping, collected_at: "2026-11-17 10:00:00+00", received_at: "2026-11-17 10:00:00+00", payload: '{"target": "node", "lost": true, "rtt_ms": 0}'}
          - {event_id: b, source: s, signal: ping, collected_at: "2026-11-17 10:00:01+00", received_at: "2026-11-17 10:00:01+00", payload: '{"target": "node", "lost": false, "rtt_ms": 12.5}'}
          - {event_id: c, source: s, signal: health, collected_at: "2026-11-17 10:00:01+00", received_at: "2026-11-17 10:00:01+00", payload: '{"cpu_temp_c": 50}'}
    expect:
      rows:
        - {event_id: a, ping_target: node, lost: true, rtt_ms: null}
        - {event_id: b, ping_target: node, lost: false, rtt_ms: 12.5}

  - name: ping_minute_builds_again_only_the_two_stretches
    description: >
      An incremental build writes the minutes of the trimmed stretch (before
      08:02, an hour and two minutes after the oldest event) and of the
      recent one (from 09:30, the minute of the late ping collected then),
      with the late ping counted and its jitter read across the minute
      boundary. The minute 09:29, between them, is read as context and not
      written: the table keeps its row.
    model: ping_minute
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_events__pings')
        rows:
          - {source: s, ping_target: node, collected_at: "2026-11-17 07:00:00+00", received_at: "2026-11-17 07:00:00.5+00", lost: false, rtt_ms: 30}
          - {source: s, ping_target: node, collected_at: "2026-11-17 09:29:58+00", received_at: "2026-11-17 09:29:58.5+00", lost: false, rtt_ms: 10}
          - {source: s, ping_target: node, collected_at: "2026-11-17 09:29:59+00", received_at: "2026-11-17 09:29:59.5+00", lost: false, rtt_ms: 14}
          - {source: s, ping_target: node, collected_at: "2026-11-17 09:30:00+00", received_at: "2026-11-17 11:10:00+00", lost: false, rtt_ms: 12}
          - {source: s, ping_target: node, collected_at: "2026-11-17 09:30:01+00", received_at: "2026-11-17 09:30:01.5+00", lost: false, rtt_ms: 32}
          - {source: s, ping_target: node, collected_at: "2026-11-17 11:00:00+00", received_at: "2026-11-17 11:00:00.5+00", lost: false, rtt_ms: 40}
      - input: this
        format: sql
        rows: |
          select * from (values
            ('2026-11-17 07:00:00+00'::timestamptz, 's', 'node', 1::bigint, 0::bigint, 30::float8, 30::float8,
             null::float8, array[30]::float8[], null::timestamptz[], null::timestamptz[], null::bigint[], null::boolean[],
             0::bigint, 0.5::float8, 0.5::float8, '2026-11-17 07:00:00.5+00'::timestamptz),
            ('2026-11-17 09:29:00+00'::timestamptz, 's', 'node', 2::bigint, 0::bigint, 12::float8, 13.8::float8,
             4::float8, array[10, 14]::float8[], null::timestamptz[], null::timestamptz[], null::bigint[], null::boolean[],
             0::bigint, 0.5::float8, 0.5::float8, '2026-11-17 09:29:59.5+00'::timestamptz),
            ('2026-11-17 09:30:00+00'::timestamptz, 's', 'node', 1::bigint, 0::bigint, 32::float8, 32::float8,
             18::float8, array[32]::float8[], null::timestamptz[], null::timestamptz[], null::bigint[], null::boolean[],
             0::bigint, 0.5::float8, 0.5::float8, '2026-11-17 09:30:01.5+00'::timestamptz),
            ('2026-11-17 11:00:00+00'::timestamptz, 's', 'node', 1::bigint, 0::bigint, 40::float8, 40::float8,
             null::float8, array[40]::float8[], null::timestamptz[], null::timestamptz[], null::bigint[], null::boolean[],
             0::bigint, 0.5::float8, 0.5::float8, '2026-11-17 11:00:00.5+00'::timestamptz)
          ) as t (
            minute_start, source, ping_target, pings, lost_pings, rtt_p50_ms, rtt_p95_ms, jitter_ms,
            rtts, run_started_at, run_last_lost_at, run_lost_pings, run_starts_outage,
            late_events, lateness_p50_seconds, lateness_max_seconds, max_received_at
          )
    expect:
      rows:
        - {minute_start: "2026-11-17 07:00:00+00", pings: 1, jitter_ms: null}
        - {minute_start: "2026-11-17 09:30:00+00", pings: 2, jitter_ms: 11}
        - {minute_start: "2026-11-17 11:00:00+00", pings: 1, jitter_ms: null}
