version: 2

# What Grafana reads (ADR-0047, decision 3), and nothing else of `serving`.
# Column names and types are a published interface (protocol 16.3):
# `contract.enforced` makes dbt compare them with the SQL and fail the build on
# any difference, before the view is created. A view is computed when read,
# so these tests read the live table as it is when the job runs.
models:
  - name: link_minute
    description: The link per minute of event time (UTC), per source and target.
    config:
      contract: {enforced: true}
    columns:
      - name: minute_start
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: source
        data_type: text
        data_tests: [not_null]
      - name: ping_target
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: [gateway, resolver-a, resolver-b, node]
      - name: pings
        data_type: bigint
        description: Pings collected in the minute; 60 when it is complete.
      - name: lost_pings
        data_type: bigint
      - name: rtt_p50_ms
        data_type: double precision
        description: Median round trip of the answered pings; null if none was.
      - name: rtt_p95_ms
        data_type: double precision
      - name: jitter_ms
        data_type: double precision
        description: Mean absolute difference between consecutive answered round trips.
    data_tests:
      - unique_combination:
          arguments:
            columns: [minute_start, source, ping_target]

  - name: link_hour_profile
    description: >
      Latency and loss by ISO day of the week (1 is Monday) and hour of the
      day, in UTC, per source and target, over the whole live table.
    config:
      contract: {enforced: true}
    columns:
      - name: day_of_week
        data_type: integer
        data_tests:
          - value_between:
              arguments:
                min_value: 1
                max_value: 7
      - name: hour_of_day
        data_type: integer
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 23
      - name: source
        data_type: text
      - name: ping_target
        data_type: text
      - name: pings
        data_type: bigint
      - name: lost_pings
        data_type: bigint
      - name: rtt_p50_ms
        data_type: double precision
      - name: rtt_p95_ms
        data_type: double precision
    data_tests:
      - unique_combination:
          arguments:
            columns: [day_of_week, hour_of_day, source, ping_target]

  - name: link_outages
    description: >
      Runs of consecutive lost pings to one target, in event time. A single
      lost ping is an outage of one second.
    config:
      contract: {enforced: true}
    columns:
      - name: outage_id
        data_type: text
        description: Source, target and the first lost ping's time.
        data_tests: [unique, not_null]
      - name: source
        data_type: text
      - name: ping_target
        data_type: text
      - name: started_at
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: last_lost_at
        data_type: timestamp with time zone
      - name: duration_seconds
        data_type: double precision
      - name: lost_pings
        data_type: bigint

  - name: source_health_minute
    description: The source's health per minute of event time (UTC).
    config:
      contract: {enforced: true}
    columns:
      - name: minute_start
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: source
        data_type: text
      - name: readings
        data_type: bigint
      - name: cpu_temp_max_c
        data_type: double precision
      - name: cpu_temp_avg_c
        data_type: double precision
      - name: cpu_freq_avg_mhz
        data_type: double precision
      - name: load_1m_avg
        data_type: double precision
      - name: throttled_seconds
        data_type: bigint
      - name: under_voltage_seconds
        data_type: bigint
      - name: disk_used_bytes
        data_type: bigint
      - name: disk_total_bytes
        data_type: bigint
    data_tests:
      - unique_combination:
          arguments:
            columns: [minute_start, source]

  - name: pipeline_minute
    description: >
      Events per minute of event time (UTC), per source and stream (the
      signal, with the target for a ping), and how late they arrived at the
      hub. An event is late when it arrived more than a minute after it was
      collected.
    config:
      contract: {enforced: true}
    columns:
      - name: minute_start
        data_type: timestamp with time zone
        data_tests: [not_null]
      - name: source
        data_type: text
      - name: event_stream
        data_type: text
      - name: events
        data_type: bigint
      - name: late_events
        data_type: bigint
      - name: lateness_p50_seconds
        data_type: double precision
      - name: lateness_max_seconds
        data_type: double precision
    data_tests:
      - unique_combination:
          arguments:
            columns: [minute_start, source, event_stream]
