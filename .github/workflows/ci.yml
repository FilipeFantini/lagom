# Checks every pull request and every push to main. Runs on GitHub's
# machines, so it costs nothing on the node.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Checkouts do not keep the job token in .git/config. These jobs only read
# the tree they just fetched; a later step has no use for the credential.

jobs:
  tools:
    name: tools (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --project tools --locked ruff format --check tools
      - run: uv run --project tools --locked ruff check tools
      - run: uv run --project tools --locked mypy --config-file tools/pyproject.toml tools
      - run: uv run --project tools --locked pytest tools

  services:
    name: services (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # Every service is its own uv project. Looping over the directory keeps
      # ADR-0006's test: adding a service changes nothing outside it.
      # mypy reads its config from the working directory, not from the project,
      # so the file is named explicitly or strict mode would silently not apply.
      - run: |
          set -euo pipefail
          for project in services/*/; do
            project="${project%/}"
            echo "::group::$project"
            uv run --project "$project" --locked ruff format --check "$project"
            uv run --project "$project" --locked ruff check "$project"
            uv run --project "$project" --locked mypy --config-file "$project/pyproject.toml" "$project"
            uv run --project "$project" --locked pytest "$project"
            echo "::endgroup::"
          done
      # The Dagster code location (ADR-0026). It also type-checks each
      # service's assets/, which import Dagster and so are excluded from the
      # service's own mypy run.
      - name: orchestration
        run: |
          set -euo pipefail
          p=platform/orchestration
          uv run --project $p --locked ruff format --check $p services/*/assets
          uv run --project $p --locked ruff check $p services/*/assets
          # From inside the project, so the assets resolve once, as imported.
          (cd $p && uv run --locked mypy lagom_orchestration ../../services/*/assets)
          uv run --project $p --locked pytest $p

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      # The whole history, not only the tip: a secret committed and then
      # deleted is still in the history, and so still leaked. On a pull
      # request the checkout is the merge commit, so the branch's commits are
      # scanned too. The scan takes under a second at this repository's size.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release binary, pinned by version and checked against its SHA-256
      # from gitleaks' checksums file. The official action would add one more
      # third-party action to trust for the same scan.
      - run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${sha256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
      # --redact keeps a found secret out of the job log, which anyone with
      # read access to the repository can open. A finding fails the job.
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  resource-budget:
    name: resource budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: uv run --project tools --locked python tools/resource_budget.py

  manifest-policy:
    name: manifest policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: uv run --project tools --locked python tools/manifest_policy.py

  promotion:
    name: promotion (prod pins only staging's digests)
    runs-on: ubuntu-latest
    steps:
      # The whole history: the check asks whether staging pinned a digest in
      # any commit before the base, not only at the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The base is what the change is compared against: the pull request's
      # base commit, or main's previous tip on a push. Passed through the
      # environment, not interpolated into the script.
      #
      # A push that creates the branch has no previous tip: GitHub sends 40
      # zeros. That happens once, when the public repository is first pushed
      # (ADR-0017). The pushed commit is then the base, so the check still
      # fails a prod digest that staging does not pin in it; what it cannot
      # see is the order before the snapshot.
      - run: |
          set -euo pipefail
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No previous tip on this push; the pushed commit is the base"
            BASE="$GITHUB_SHA"
          fi
          uv run --project tools --locked python tools/promotion_check.py --base "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

  warehouse:
    # The name is a required check on `main` (CONTRIBUTING, branch protection),
    # so it stays as it is although the job now also builds and tests.
    name: warehouse (lint, parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --project platform/warehouse --locked sqlfluff lint platform/warehouse
      # `dbt parse` reads the project and the profile but never opens a
      # connection, so the connection variables only need to exist. The values
      # are placeholders, not credentials: nothing here can reach a database,
      # and the real ones never leave the operator's machine and the cluster.
      # This does not check the SQL against a database, nor run any test.
      - run: >
          uv run --project platform/warehouse --locked dbt parse
          --project-dir platform/warehouse --profiles-dir platform/warehouse
        env:
          LAGOM_PG_HOST: localhost
          LAGOM_PG_PORT: "5432"
          LAGOM_PG_USER: ci-placeholder
          LAGOM_PG_PASSWORD: ci-placeholder
          LAGOM_PG_DBNAME: ci-placeholder
          LAGOM_PG_SSLMODE: disable
      # The tests, against data. `dbt build` on the `lake` target (DuckDB on a
      # DuckLake), the target Dagster runs in staging and prod, over a small
      # hand-made bronze table: it runs the models, the unit tests, the data
      # tests and the reconciliations. dbt-duckdb lives in the orchestration
      # project's lockfile, so that is the environment used here, the same
      # one the image runs. The catalog and the Parquet files are a temporary
      # directory on the runner: no R2, no Postgres. The R2 variables are
      # placeholders the profile requires; nothing here opens a connection to
      # it. `gold_reader_privileges` is not run: it needs a Postgres role, and
      # dbt_project.yml enables it on the postgres target only.
      - name: dbt build (lake target, fixture bronze)
        run: |
          set -euo pipefail
          lake="$(mktemp -d)"
          export LAGOM_LAKE_CATALOG="ducklake:${lake}/catalog.ducklake"
          export LAGOM_LAKE_DATA_PATH="${lake}/data/"
          uv run --project platform/orchestration --locked \
            python platform/warehouse/ci/load_fixture.py
          uv run --project platform/orchestration --locked dbt build \
            --target lake --no-partial-parse \
            --project-dir platform/warehouse --profiles-dir platform/warehouse
        env:
          LAGOM_LAKE_METADATA_SCHEMA: main
          LAGOM_R2_ACCESS_KEY_ID: ci-placeholder
          LAGOM_R2_SECRET_ACCESS_KEY: ci-placeholder
          LAGOM_R2_ENDPOINT: https://ci-placeholder.invalid

  dashboards:
    # What this proves: the boards under products/dashboards validate, render
    # against a lake built as the `warehouse` job builds it (gold in Parquet
    # files, as in the cluster), no query is empty, and every column of every
    # query a board draws equals what gold holds over the same window
    # (check_boards.py: the one thing it leaves out is a constant label). The
    # render exits 0 on a query that returns nothing; the check does not. The
    # fixture holds an earthquake a second inside the 30-day window and one a
    # second outside it, and the render and the check run in a time zone far
    # from UTC, so a window that is wrong, or a check that follows the
    # machine's zone, fails.
    # What it does not prove: anything about real data, how the page looks in a
    # browser, or publishing: nothing is uploaded and no secret is used.
    name: dashboards (render)
    runs-on: ubuntu-latest
    env:
      # dct sends usage statistics to dbt Labs unless told not to
      # (docs/adr/0040-dbt-charts-for-the-dashboards.md).
      DO_NOT_TRACK: "1"
      # check_boards.py and its tests import the code location's lake module.
      PYTHONPATH: products/dashboards:platform/orchestration
      # The variables the `lake` target requires. The R2 values are
      # placeholders; the lake is a directory on the runner.
      LAGOM_LAKE_METADATA_SCHEMA: main
      LAGOM_R2_ACCESS_KEY_ID: ci-placeholder
      LAGOM_R2_SECRET_ACCESS_KEY: ci-placeholder
      LAGOM_R2_ENDPOINT: https://ci-placeholder.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # The check's own code, with the orchestration project's settings. ruff
      # finds its config from the file's directory, so it is named; mypy runs
      # from the project, as the `services` job does, so the lake module
      # resolves.
      - name: check_boards (lint, types, tests)
        run: |
          set -euo pipefail
          p=platform/orchestration
          uv run --project $p --locked ruff format --check --config $p/pyproject.toml products/dashboards
          uv run --project $p --locked ruff check --config $p/pyproject.toml products/dashboards
          (cd $p && uv run --locked mypy lagom_orchestration ../../products/dashboards)
          uv run --project $p --locked pytest products/dashboards/tests
      - name: build the fixture lake, then validate and render the boards
        run: |
          set -euo pipefail
          lake="$(mktemp -d)"
          out="$RUNNER_TEMP/dashboards"
          mkdir -p "$out"
          export LAGOM_LAKE_CATALOG="ducklake:${lake}/catalog.ducklake"
          export LAGOM_LAKE_DATA_PATH="${lake}/data/"
          u="uv run --project platform/orchestration --locked --group dashboards"
          # As the `warehouse` job.
          $u python platform/warehouse/ci/load_fixture.py
          $u dbt build --target lake --no-partial-parse \
            --project-dir platform/warehouse --profiles-dir platform/warehouse
          # DuckLake keeps a table of up to 10 rows in its catalog and writes no
          # file. Gold would then never be read from Parquet, which is how it is
          # read in the cluster and where dct's file lock applies
          # (products/dashboards/profiles.yml). Writing the files out makes this
          # job exercise the same path.
          $u python - <<'PY'
          from lagom_orchestration.lake import attach_lake

          attach_lake().execute("CALL ducklake_flush_inlined_data('lake')")
          PY
          # The manifest dct resolves ref() against. `dbt build` writes one too;
          # this is the command the cluster step will run.
          $u dbt parse --target lake \
            --project-dir platform/warehouse --profiles-dir platform/warehouse
          # Everything from here runs in a time zone 13 hours from UTC. The
          # fixture has earthquakes between 11:00 and 24:00 UTC, so a day bucket
          # or a displayed time in check_boards.py that follows the machine's
          # zone and not UTC lands on another day, and the check fails. Not
          # covered: the window's anchor (the latest earthquake is at 00:00 UTC,
          # the same calendar day in this zone), and the board's own
          # `at time zone 'UTC'`, since dct runs its queries in UTC whatever the
          # zone (products/dashboards/README.md).
          export TZ=Pacific/Auckland
          # --strict: a warning fails. --warehouse: the SQL is described against
          # the lake, which catches a column that does not exist. It does not
          # read data, so the render below is what catches the rest.
          $u dct validate --strict --warehouse products/dashboards/charts \
            --project-dir products/dashboards
          # --no-cache: a cached result is not a render of this lake. A class
          # that no earthquake in the window belongs to is expected, and is not
          # worth a warning.
          for format in html data; do
            $u dct render products/dashboards/charts/*.yml --project-dir products/dashboards \
              --no-cache --ignore-warning WARN-CATEGORY-COLOR-PIN-UNSEEN --format $format \
              --output "${out}/{stem}.${format}"
          done
          ls -l "$out"
          $u python products/dashboards/check_boards.py "$out"/*.data
      # The published page is one file that loads nothing from outside: no
      # script, stylesheet, image or frame by address, no CSS @import, and no
      # url() to another host. A link a reader clicks (<a href>) is not a load,
      # and url(#id) points inside the page. `test -s` first: a page that is
      # missing or empty must fail, not pass the search for what is in it.
      - name: the rendered pages load nothing from outside
        run: |
          set -euo pipefail
          for page in "$RUNNER_TEMP"/dashboards/*.html; do
            test -s "$page"
            if grep -n -E "<(script|link|img|iframe|source)[^>]*(src|href)=|@import|url\([[:space:]]*['\"]?(https?:)?//" "$page"; then
              echo "::error::$page references an external resource"
              exit 1
            fi
          done
